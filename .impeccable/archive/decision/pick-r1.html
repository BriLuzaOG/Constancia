<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ScholarKey — Security Printing</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#F4F1E8;color:#1D3B2F;font-family:system-ui,sans-serif;overflow:hidden;padding:40px}
.note{height:100%;border:3px solid #1D3B2F;display:grid;grid-template-columns:1fr 520px;background:repeating-radial-gradient(circle at 78% 50%,#F4F1E8 0 6px,#e3dccb 6px 7px)}
.copy{padding:56px}h1{font:800 88px/0.95 Georgia,serif;letter-spacing:-.02em}
.micro{margin-top:30px;font:600 13px/1.6 ui-monospace,monospace;letter-spacing:.2em;color:#B8476A}
.serial{margin-top:40px;font:700 34px ui-monospace,monospace;color:#B8476A}
.rosette{align-self:center;justify-self:center;width:440px;height:440px;border-radius:50%;background:repeating-conic-gradient(#1D3B2F 0 2deg,#F4F1E8 2deg 6deg);display:grid;place-items:center}
.rosette div{width:300px;height:300px;border-radius:50%;background:#F4F1E8;border:3px solid #1D3B2F;display:grid;place-items:center;text-align:center;font:700 28px/1.2 system-ui}
.cta{display:flex;gap:16px;margin-top:40px}.cta span{padding:18px 28px;border:3px solid #1D3B2F;font-size:22px;font-weight:700}.cta span:first-child{background:#1D3B2F;color:#F4F1E8}
</style></head><body><div class="note"><div class="copy"><h1>A diploma you cannot forge.</h1>
<div class="micro">TOKEN · ISSUER · SIGNATURE · SEAL · ANCHOR · TOKEN · ISSUER · SIGNATURE · SEAL · ANCHOR</div>
<div class="serial">Nº 0x7F3A…C41E</div><div class="cta"><span>Verify a diploma</span><span>Issue credentials</span></div></div>
<div class="rosette"><div>Drop a diploma PDF<br>in the rosette</div></div></div></body></html>

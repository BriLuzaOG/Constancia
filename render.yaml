services:
  - type: web
    name: platanus-hack-26-ve-team-24
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install -g pnpm@12.15.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    # Deploys are triggered by .github/workflows/cd.yml after the build gate passes.
    # Leaving this on would deploy twice per push: once before CI, once after.
    autoDeployTrigger: 'off'

  # The demo university: its own origin, because did:web trust comes from the institution's domain.
  # A4-S7 replaces university-site/.well-known/did.json with the real one after onboarding.
  - type: web
    name: waraira-university
    runtime: static
    staticPublishPath: ./university-site
    branch: main
    # Static content only: redeploy on every commit, no CI gate needed.
    autoDeployTrigger: commit
    headers:
      - path: /.well-known/did.json
        name: Content-Type
        value: application/json
